# MediaMTX on the Linode (the owner's stream; the world's Japhar screen reads rtsp://stream.japharsworld.com:8554/live).
# A template: deploy/mediamtx-setup.sh fills the placeholders from /etc/mediamtx/credentials.env into
# /etc/mediamtx/mediamtx.yml (root:mediamtx 0640). Keys not set here keep MediaMTX's defaults (v1.21.2).
# The flow: home publishes to "ingest" (RTMP 1935 or RTSP, from the home address only: ufw, deploy/harden.sh), this box
# turns ingest into "live" (runOnReady below), and anyone may read "live".
logLevel: info

authMethod: internal
authInternalUsers:
  # Anyone may watch live, and nothing else.
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path: live
  # Home's encoder (OBS) publishes ingest.
  - user: __PUBLISH_USER__
    pass: __PUBLISH_PASS__
    ips: []
    permissions:
      - action: publish
        path: ingest
  # This box: reads ingest and publishes live (the runOnReady command), plus the local API and metrics.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: read
        path: ingest
      - action: publish
        path: live
      - action: api
      - action: metrics

api: false
metrics: false
pprof: false
playback: false

rtsp: true
rtspAddress: :8554
# UDP (rtpAddress :8000, rtcpAddress :8001) is closed by ufw, so players fall back to RTSP over TCP on 8554.
rtmp: true
rtmpAddress: :1935
hls: false
webrtc: false
srt: false

paths:
  ingest:
    # LIVE_FROM_INGEST in credentials.env: what turns ingest into live (the default copies the stream unchanged).
    runOnReady: __LIVE_FROM_INGEST__
    runOnReadyRestart: yes
  live:
